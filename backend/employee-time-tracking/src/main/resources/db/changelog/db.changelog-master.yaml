        - sqlFile:
            path: db/changelog/003-time-entry-rejection-reason.sql
            relativeToChangelogFile: false
            splitStatements: true
            stripComments: true

  - changeSet:
      id: 004-time-entry-correction-reason
      author: app
      changes:
        - sqlFile:
            path: db/changelog/004-time-entry-correction-reason.sql
            relativeToChangelogFile: false
            splitStatements: true
            stripComments: true

  - changeSet:
      id: 005-companies-and-memberships
      author: app
      changes:
        - sqlFile:
            path: db/changelog/005-companies-and-memberships.sql
