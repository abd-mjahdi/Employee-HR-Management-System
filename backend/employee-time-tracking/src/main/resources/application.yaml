spring:
  application:
    name: EmployeeTimeTracking

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000

    liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Default includes demo tenants. For a true first-run bootstrap, recreate the DB with LIQUIBASE_CONTEXTS empty.
    contexts: ${LIQUIBASE_CONTEXTS:seed}

holidays:
  dates:

app:
  bootstrap:
    # Empty disables POST /internal/bootstrap/company. Set BOOTSTRAP_KEY for first-run only.
    key: ${BOOTSTRAP_KEY:}
  tenant:
    base-domain: myhr.com
    local-dev-suffix: localhost
    allow-apex: false
    allow-www: false
    trust-forwarded-host: false
    # Production must leave this empty. Local API on localhost:8080: TENANT_DEV_DEFAULT_SLUG=acme
    dev-default-slug: ${TENANT_DEV_DEFAULT_SLUG:}
    reserved-slugs:
      - www
      - api
      - app
      - admin
      - mail
      - localhost
  login:
    max-failed-attempts: 10
    window-ms: 900000

reports:
  payroll:
    overtime:
      daily-hours: 8.0
      weekly-hours: 40.0
  max-range-days: 366

logging:
  level:
    liquibase: info