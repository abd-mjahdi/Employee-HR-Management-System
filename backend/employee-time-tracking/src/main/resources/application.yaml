spring:
  application:
    name: EmployeeTimeTracking

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: seed

holidays:
  dates:

app:
  tenant:
    base-domain: myhr.com
    local-dev-suffix: localhost
    allow-apex: false
    allow-www: false
    trust-forwarded-host: false
    # Production must leave this empty. Local API on localhost:8080: TENANT_DEV_DEFAULT_SLUG=acme
    dev-default-slug: ${TENANT_DEV_DEFAULT_SLUG:}
    reserved-slugs:
      - www
      - api
      - app
      - admin
      - mail
      - localhost

logging:
  level:
    liquibase: info